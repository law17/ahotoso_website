title: "Ahotosoɔ"
name: "Ahotosoɔ Services Ltd"
description: "Your trusted presence in Ghana. Independent verification, property oversight, construction monitoring and local representation for people living abroad."
url: "https://law17.github.io"  ## "https://ahotoso.com"
baseurl: "/ahotoso_website"    ## ""
locale: "en-GB"
timezone: "Europe/London"
markdown: kramdown
permalink: pretty
sass:
  sass_dir: assets/css
  style: compressed
plugins:
  - jekyll-seo-tag
  - jekyll-sitemap
exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - vendor
  - node_modules
  - docs
include:
  - _pages
# Service-request delivery. Paste the unique Formspree form endpoint here after
# creating the Ahotosoɔ service-request form (for example: https://formspree.io/f/xxxxxx).
forms:
  service_request_endpoint: ""

# Central contact configuration. Keep client-facing contact details here so
# pages do not need to be edited when a number or mailbox changes.
contact:
  email: "hello@ahotoso.com"
  support_email: "support@ahotoso.com"
  projects_email: "projects@ahotoso.com"
  property_email: "property@ahotoso.com"
  accounts_email: "accounts@ahotoso.com"
  # Add the business WhatsApp number in international format using digits only,
  # for example 233XXXXXXXXX. Leave blank until the number is ready to publish.
  whatsapp_number: ""
  whatsapp_message: "Hello Ahotosoɔ. I would like help with a property or project in Ghana."
