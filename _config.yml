title: "Ahotosoɔ"
name: "Ahotosoɔ Services Ltd"
description: "Your trusted presence in Ghana. Independent verification, property oversight, construction monitoring and local representation for people living abroad."
url: "https://ahotoso.com"
baseurl: ""
locale: "en-GB"
timezone: "Europe/London"
markdown: kramdown
permalink: pretty
sass:
